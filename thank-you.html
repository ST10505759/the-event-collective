<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | The Event Collective</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f1ec;
            color: #1c1c1c;
            font-family: Georgia, "Times New Roman", serif;
        }

        .thank-you-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .thank-you-content {
            max-width: 700px;
        }

        .small-heading {
            font-size: 11px;
            letter-spacing: 5px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 70px;
            font-weight: normal;
            line-height: 1;
            margin-bottom: 30px;
        }

        .message {
            font-size: 18px;
            line-height: 1.8;
            max-width: 570px;
            margin: 0 auto 40px;
        }

        .home-button {
            display: inline-block;
            padding: 16px 35px;
            background-color: #1c1c1c;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            letter-spacing: 2px;
        }

        .home-button:hover {
            opacity: 0.8;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 46px;
            }
        }
    </style>
</head>

<body>

    <main class="thank-you-page">

        <div class="thank-you-content">

            <p class="small-heading">THE EVENT COLLECTIVE</p>

            <h1>
                Thank you<br>
                for getting<br>
                in touch.
            </h1>

            <p class="message">
                Your enquiry has been received. We can't wait to hear more
                about your celebration and help bring your ideas to life.
                We'll be in touch soon.
            </p>

            <a href="index.html" class="home-button">
                RETURN TO HOME
            </a>

        </div>

    </main>

</body>
</html>
